services:
  api-blue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mlops-api-blue
    environment:
      - DEPLOYMENT_SLOT=blue
      - MLFLOW_TRACKING_URI=sqlite:///mlflow.db
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
    ports:
      - "8001:8000"
    restart: unless-stopped

  api-green:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mlops-api-green
    environment:
      - DEPLOYMENT_SLOT=green
      - MLFLOW_TRACKING_URI=sqlite:///mlflow.db
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
    ports:
      - "8002:8000"
    restart: unless-stopped

  nginx-lb:
    image: nginx:1.25-alpine
    container_name: mlops-nginx-lb
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-blue
      - api-green
    restart: unless-stopped
