services:
  # 1. Control Plane Container — Light UI Dashboard, Project Manager & Centralized Model Registry
  mlops-control-plane:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mlops-control-plane
    environment:
      - SERVICE_ROLE=control-plane
      - DEPLOYMENT_SLOT=blue
      - ACTIVE_PROJECT_ID=house_price
      - MLFLOW_TRACKING_URI=sqlite:///mlflow.db
    volumes:
      - ./projects:/app/projects
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    restart: unless-stopped

  # 2. CD Model Serving Container (Blue Slot — Dynamic & Ensemble Output)
  mlops-serving-blue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mlops-serving-blue
    environment:
      - SERVICE_ROLE=serving-blue
      - DEPLOYMENT_SLOT=blue
      - ACTIVE_PROJECT_ID=house_price
      - MLFLOW_TRACKING_URI=sqlite:///mlflow.db
    volumes:
      - ./projects:/app/projects
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
    ports:
      - "8001:8000"
    restart: unless-stopped

  # 3. CD Model Serving Container (Green Slot — Zero-Downtime Standby/Active)
  mlops-serving-green:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mlops-serving-green
    environment:
      - SERVICE_ROLE=serving-green
      - DEPLOYMENT_SLOT=green
      - ACTIVE_PROJECT_ID=house_price
      - MLFLOW_TRACKING_URI=sqlite:///mlflow.db
    volumes:
      - ./projects:/app/projects
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
    ports:
      - "8002:8000"
    restart: unless-stopped

  # 4. Continuous Training (CT) & Statistical Drift Monitoring Worker Container
  mlops-drift-ct-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mlops-drift-ct-worker
    environment:
      - SERVICE_ROLE=drift-ct-worker
      - DEPLOYMENT_SLOT=ct-worker
      - ACTIVE_PROJECT_ID=house_price
      - MLFLOW_TRACKING_URI=sqlite:///mlflow.db
    volumes:
      - ./projects:/app/projects
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
    ports:
      - "8003:8000"
    restart: unless-stopped

  # 5. MLflow Experiment Tracking & Artifact UI Server Container
  mlops-mlflow-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mlops-mlflow-server
    command: ["mlflow", "ui", "--host", "0.0.0.0", "--port", "5000", "--backend-store-uri", "sqlite:///mlflow.db"]
    volumes:
      - ./mlflow.db:/app/mlflow.db
      - ./mlruns:/app/mlruns
    ports:
      - "5000:5000"
    restart: unless-stopped

  # 6. Nginx Reverse Proxy & Zero-Downtime Blue/Green Load Balancer Gateway
  mlops-nginx-gateway:
    image: nginx:1.25-alpine
    container_name: mlops-nginx-gateway
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - mlops-control-plane
      - mlops-serving-blue
      - mlops-serving-green
    restart: unless-stopped
