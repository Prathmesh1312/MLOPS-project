name: "3. CT — Automated Drift Retraining (Cloudflare R2 + MLflow)"

on:
  repository_dispatch:
    types: ["micro_climate_drift_detected"]
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      drift_reason:
        description: "Reason for triggering Continuous Training"
        required: false
        default: "manual_ct_dispatch"

permissions:
  contents: write
  packages: write

jobs:
  continuous-training:
    name: "Pull R2 Data -> Retrain Multi-Model Ensemble -> Promote in MLflow"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install OpenMP & Python dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libgomp1
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pull latest production dataset from Cloudflare R2 (or generate fallback)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          if [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            bash scripts/setup_cloud_remotes.sh
            dvc pull -r cloudflare_r2 || python -m src.data.dataset
          else
            echo "Cloudflare R2 credentials not set in environment; preparing local dataset..."
            python -m src.data.dataset
          fi

      - name: Retrain Multi-Model Ensemble & Evaluate Quality Gate via MLflow
        run: |
          python -c "from src.models.train import train_and_promote; res = train_and_promote(trigger_reason='github_actions_ct_webhook'); print(res)"

      - name: Verify Updated Model with Pytest
        run: |
          pytest -v

      - name: Push updated artifacts to Cloudflare R2 & commit model metadata
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          if [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            dvc repro
            dvc push -r cloudflare_r2
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/champion_metadata.json || true
          git diff --staged --quiet || git commit -m "chore(ct): promote updated ensemble model via automated CT pipeline"
          git push || true
