name: "2. CD — Build GHCR Image & Zero-Downtime AWS EC2 Deployment"

on:
  push:
    branches: ["main"]
  workflow_run:
    workflows: ["3. CT — Automated Drift Retraining (Cloudflare R2 + MLflow)"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: "Multi-Stage Build & Push to GHCR"
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-stage python:3.11-slim-bookworm image
        id: meta
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          docker build -t "${IMAGE_LOWER}:latest" -t "${IMAGE_LOWER}:${{ github.sha }}" .
          docker push "${IMAGE_LOWER}:latest"
          docker push "${IMAGE_LOWER}:${{ github.sha }}"
          echo "image_tag=${IMAGE_LOWER}:latest" >> "$GITHUB_OUTPUT"

  deploy-aws-ec2:
    name: "Zero-Downtime Blue-Green Deploy to AWS EC2"
    needs: build-and-push
    runs-on: ubuntu-latest
    if: ${{ secrets.EC2_HOST != '' && secrets.EC2_SSH_KEY != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute Zero-Downtime Blue-Green Deployment on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          scp scripts/deploy_zero_downtime.sh "${EC2_USER}@${EC2_HOST}:/tmp/deploy_zero_downtime.sh"
          ssh "${EC2_USER}@${EC2_HOST}" "chmod +x /tmp/deploy_zero_downtime.sh && docker pull ${IMAGE_TAG} && /tmp/deploy_zero_downtime.sh ${IMAGE_TAG}"
