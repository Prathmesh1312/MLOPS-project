events {
    worker_connections 1024;
}

http {
    # Zero-Downtime Blue-Green Upstream Pool across Serving Containers
    upstream mlops_backend {
        # Active primary slot
        server mlops-serving-blue:8000 max_fails=2 fail_timeout=5s;
        # Standby failover slot
        server mlops-serving-green:8000 backup;
    }

    server {
        listen 80;
        server_name _;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504;

        location / {
            proxy_pass http://mlops_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Cloud-Proxy "nginx-blue-green-lb";
        }
    }
}
